[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "topthink-think-ai"
version = "1.0.1"
description = "Official ThinkAI SDK for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "TOPThink"}]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "build>=1.2",
  "hatchling>=1.26",
  "ruff==0.17.0",
]
publish = ["twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/thinkai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.0"
line-length = 1000
target-version = "py311"
extend-exclude = [".tools", ".package-check", "dist", "*.md"]

[tool.ruff.format]
docstring-code-format = false
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
