name: SDK contracts and packages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node scripts/release.mjs check all
      - run: node --test tests/release/*.test.mjs

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: python tests/php/verify-migration.py
      - run: python tests/packaging/php-dist.py
      - name: Stage verified PHP package
        id: package
        run: node scripts/ci-artifacts.mjs php
      - uses: actions/upload-artifact@v7
        with:
          name: think-ai-php-${{ steps.package.outputs.version }}-php${{ matrix.php }}
          path: ${{ steps.package.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install './python[dev]'
      - name: Check Python formatting
        run: >-
          python -m ruff format --check --config python/pyproject.toml
          python java/scripts dotnet/scripts tests/php tests/packaging scripts/central-bundle.py
      - run: python -m pytest python/tests -q
      - run: python -m build python
      - run: python python/scripts/check_package.py
      - name: Stage verified Python packages
        id: package
        run: node scripts/ci-artifacts.mjs python
      - uses: actions/upload-artifact@v7
        with:
          name: think-ai-python-${{ steps.package.outputs.version }}-py${{ matrix.python }}
          path: ${{ steps.package.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            artifact: node22
          - node: 'lts/*'
            artifact: node-lts
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm pack
      - run: npm run check:package
      - name: Stage verified npm package
        id: package
        working-directory: ${{ github.workspace }}
        run: node scripts/ci-artifacts.mjs typescript
      - uses: actions/upload-artifact@v7
        with:
          name: think-ai-npm-${{ steps.package.outputs.version }}-${{ matrix.artifact }}
          path: ${{ steps.package.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', 'stable']
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check Go formatting
        run: |
          unformatted_files="$(gofmt -l .)"
          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            exit 1
          fi
      - run: go test ./... -count=1 -timeout=120s
      - run: go vet ./...

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: java/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Java formatting
        if: matrix.java == '17'
        run: mvn -B -f java/pom.xml spotless:check
      - run: mvn -B -f java/pom.xml verify
      - run: python java/scripts/verify_package.py
      - name: Stage verified Maven packages
        id: package
        run: node scripts/ci-artifacts.mjs java
      - uses: actions/upload-artifact@v7
        with:
          name: think-ai-java-${{ steps.package.outputs.version }}-jdk${{ matrix.java }}
          path: ${{ steps.package.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: dotnet test dotnet/TopThink.ThinkAI.Tests --configuration Release
      - name: Check C# formatting
        run: |
          dotnet format whitespace dotnet/TopThink.ThinkAI/TopThink.ThinkAI.csproj --no-restore --verify-no-changes
          dotnet format whitespace dotnet/TopThink.ThinkAI.Tests/TopThink.ThinkAI.Tests.csproj --no-restore --verify-no-changes
          dotnet format style dotnet/TopThink.ThinkAI/TopThink.ThinkAI.csproj --no-restore --diagnostics IDE0011 --severity info --verify-no-changes
          dotnet format style dotnet/TopThink.ThinkAI.Tests/TopThink.ThinkAI.Tests.csproj --no-restore --diagnostics IDE0011 --severity info --verify-no-changes
      - run: python dotnet/scripts/verify_package.py
      - name: Stage verified NuGet package
        id: package
        run: node scripts/ci-artifacts.mjs dotnet
      - uses: actions/upload-artifact@v7
        with:
          name: think-ai-dotnet-${{ steps.package.outputs.version }}-net10
          path: ${{ steps.package.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
